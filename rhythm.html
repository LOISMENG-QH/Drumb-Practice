<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节奏型练习器 · 4/4 拍 · 可调 BPM</title>
<style>
  :root {
    --bg: #f7f4ef;
    --panel: #ffffff;
    --ink: #26292e;
    --muted: #858b93;
    --line: #e7e1d6;
    --accent: #e8590c;
    --accent-soft: rgba(232, 89, 12, 0.09);
    --accent-hover: rgba(232, 89, 12, 0.20);
    --staff: #33373d;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 16px 24px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 30;
  }
  .logo {
    font-size: 30px; width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffe4d1, #ffd9c2); border-radius: 12px;
  }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: 0.5px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

  .legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    padding: 10px 24px; background: var(--panel);
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .tip { color: var(--muted); margin-left: auto; font-size: 12px; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center;
    padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--line); position: sticky; top: 81px; z-index: 20;
  }
  .group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .toolbar input[type=number] {
    width: 56px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; text-align: center; background: #fff; color: var(--ink);
  }
  .toolbar select {
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13.5px; background: #fff; color: var(--ink); font-family: inherit;
  }
  .toolbar input[type=number]:focus, .toolbar select:focus {
    outline: 2px solid var(--accent-hover); border-color: var(--accent);
  }
  button {
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    padding: 8px 14px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    transition: transform .05s, box-shadow .1s, background .12s, border-color .12s;
  }
  button:hover { background: #faf7f1; border-color: #d8d0c2; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #d34f0a; border-color: #d34f0a; }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .pattern-panel { padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .pattern-panel .toggle {
    background: transparent; border: none; color: var(--accent);
    font-weight: 700; padding: 4px 0; font-size: 13px;
  }
  .pattern-panel .toggle:hover { background: transparent; }
  .pool { display: none; margin-top: 8px; }
  .pool.open { display: block; }
  .pool-actions { margin-bottom: 8px; }
  .pool-actions button { padding: 4px 12px; font-size: 12px; }
  .pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .pat {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
    cursor: pointer; user-select: none; background: #fff;
  }
  .pat:hover { border-color: var(--accent); }
  .pat input { accent-color: var(--accent); cursor: pointer; }
  .pat-head { display: flex; align-items: center; gap: 7px; }
  .pname { font-weight: 700; font-size: 13px; }
  /* 节奏型条带可视化：按音符时值画宽度 */
  .pbar { display: flex; gap: 2px; height: 12px; align-items: stretch; }
  .pbar i { background: var(--accent); border-radius: 2px; }
  .pbar i.rest { background: #efeae1; }
  .pdots { display: flex; gap: 2px; }
  .pdots i { width: 9px; height: 13px; border-radius: 2px; background: #efeae1; }
  .pdots i.on { background: var(--accent); }

  main { padding: 26px 24px 60px; }
  .score-wrap {
    overflow-x: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); padding: 18px 10px;
    max-width: 1180px; margin: 0 auto;
  }
  #score svg { display: block; }
  #score svg * { pointer-events: none; }
  #score svg rect.beat { pointer-events: all; cursor: pointer; }
  rect.beat { fill: transparent; transition: fill .1s; }
  rect.beat:hover { fill: var(--accent-hover); }
  rect.beat.on { fill: var(--accent-soft); }
  rect.playhead { fill: var(--accent); opacity: 0.14; }
  text.plabel { font-size: 13px; font-weight: 700; fill: var(--muted); }
  text.mnum { font-size: 10.5px; fill: var(--muted); }
  text.bnum { font-size: 9.5px; fill: var(--muted); }

  .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.32); opacity: 0; visibility: hidden; transition: .2s; z-index: 40; }
  .drawer-mask.open { opacity: 1; visibility: visible; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 92vw;
    background: var(--panel); box-shadow: -8px 0 30px rgba(0,0,0,0.12);
    transform: translateX(100%); transition: transform .24s; z-index: 41;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .drawer-head h2 { margin: 0; font-size: 16px; }
  .drawer-head button { border: none; background: transparent; font-size: 20px; color: var(--muted); padding: 0 6px; }
  .drawer-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .lib-empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 30px; }
  .lib-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .lib-item .name { font-weight: 700; font-size: 14px; }
  .lib-item .meta { color: var(--muted); font-size: 12px; margin: 3px 0 8px; }
  .lib-item .acts { display: flex; gap: 8px; }
  .lib-item .acts button { padding: 5px 12px; font-size: 12.5px; }

  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.32); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; padding: 22px; width: 340px; max-width: 90vw; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  .modal input:focus { outline: 2px solid var(--accent-hover); border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 20px);
    background: #26292e; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13.5px; opacity: 0; visibility: hidden; transition: .2s; z-index: 60;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  @media print {
    header, .legend, .toolbar, .pattern-panel, .drawer, .drawer-mask, .modal-mask, .toast { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .score-wrap { border: none; box-shadow: none; padding: 10px 0; max-width: none; overflow: visible; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">🎵</div>
    <div class="brand">
      <h1>节奏型练习器</h1>
      <p>4/4 拍 · 16 分音符网格 · 8 种节奏型随机组合 · BPM 可调</p>
    </div>
  </header>

  <section class="legend">
    <span class="tip">💡 点击谱面上任意一拍，可循环切换该拍的节奏型（含「空拍」）</span>
  </section>

  <div class="toolbar">
    <div class="group">
      <label>小节数 <input type="number" id="measureCount" min="1" max="32" value="4"></label>
      <label>每行小节 <input type="number" id="measuresPerLine" min="1" max="8" value="4"></label>
      <label>速度 BPM <input type="number" id="bpm" min="30" max="240" value="80"></label>
      <label>内容占
        <select id="fillBeats">
          <option value="2">2 拍</option>
          <option value="3">3 拍</option>
          <option value="4" selected>4 拍</option>
        </select>
      </label>
      <span id="layoutHint" style="font-size:12.5px;color:var(--muted);"></span>
    </div>
    <div class="group">
      <button id="randomBtn" class="primary">🎲 随机生成</button>
      <button id="clearBtn">清空</button>
      <button id="playBtn">▶ 试听</button>
      <button id="clickBtn">🔔 节拍器：开</button>
      <button id="saveBtn">💾 保存</button>
      <button id="libraryBtn">📚 我的练习</button>
      <button id="exportBtn">导出</button>
      <button id="importBtn">导入</button>
      <button id="printBtn">🖨 打印</button>
      <button id="syncBtn">☁️ 云端同步</button>
    </div>
  </div>

  <div class="pattern-panel">
    <button class="toggle" id="patternToggle">▸ 节奏型池设置（随机生成时允许出现的节奏型）</button>
    <div class="pool" id="poolWrap">
      <div class="pool-actions">
        <button id="allOn">全选</button>
        <button id="allOff">全不选</button>
      </div>
      <div class="pool-grid" id="patternPool"></div>
    </div>
  </div>

  <main>
    <div class="score-wrap" id="score"></div>
  </main>

  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="libraryDrawer">
    <div class="drawer-head"><h2>我的练习</h2><button id="closeLibrary" title="关闭">×</button></div>
    <div class="drawer-body" id="libraryList"></div>
  </aside>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3>保存练习</h3>
      <input id="saveName" placeholder="给这个练习起个名字">
      <div class="modal-btns">
        <button id="cancelSave">取消</button>
        <button id="confirmSave" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 云端同步弹窗 -->
  <div class="modal-mask" id="syncMask">
    <div class="modal" style="width: 400px;">
      <h3>☁️ 云端同步（GitHub Gist）</h3>
      <div id="syncStatus" style="font-size:13px;color:var(--muted);margin-bottom:10px;">⚪ 未绑定</div>
      <input id="gistToken" placeholder="粘贴你的 GitHub Token（ghp_...）">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button id="gistConnect" class="primary">连接 / 绑定</button>
        <button id="gistUpload">⬆️ 上传到云端</button>
        <button id="gistDownload">⬇️ 从云端拉取</button>
      </div>
      <div style="margin-top:14px;">
        <button id="gistUnbind" class="ghost" style="color:#c0392b;padding:4px 0;">解除绑定</button>
      </div>
      <div class="modal-btns"><button id="syncClose">关闭</button></div>
    </div>
  </div>

  <input type="file" id="importFile" accept=".json" style="display:none">

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- 节奏型定义（1 拍 = 4 个 16 分格）----------
  // cells: 16 分网格上哪些位置有符头
  // dur:   依次对应每个符头的时值（单位=16分音符：1=16分 2=8分 3=附点8分 4=4分）
  var PATTERNS = [
    { key: 'q',    name: '4分',        cells: [1,0,0,0], dur: [4] },
    { key: 'e',    name: '8分',        cells: [1,0,1,0], dur: [2,2] },
    { key: 's',    name: '16分',       cells: [1,1,1,1], dur: [1,1,1,1] },
    { key: 'ess',  name: '前八后十六',  cells: [1,0,1,1], dur: [2,1,1] },
    { key: 'sse',  name: '前十六后八',  cells: [1,1,1,0], dur: [1,1,2] },
    { key: 'sync', name: '切分',       cells: [1,1,0,1], dur: [1,2,1] },
    { key: 'dot',  name: '附点',       cells: [1,0,0,1], dur: [3,1] },
    { key: 'rdot', name: '后附点',      cells: [1,1,0,0], dur: [1,3] }
  ];
  var PAT_BY_KEY = {};
  for (var _i = 0; _i < PATTERNS.length; _i++) PAT_BY_KEY[PATTERNS[_i].key] = PATTERNS[_i];

  // 内容占几拍 → 哪些拍位填节奏（1=有内容 0=空拍）
  var LAYOUTS = { 2: [1,0,1,0], 3: [1,1,1,0], 4: [1,1,1,1] };

  // ---------- 绘制几何 ----------
  var LINE = 8, STAFF_H = 32, TOP_PAD = 28, SYS_GAP = 42;
  var LEFT_W = 74, RIGHT_PAD = 14, MEAS_W = 176, BEAT_W = MEAS_W / 4;
  var STAFF_COLOR = '#33373d', NOTE_Y_OFFSET = 16, STEM_H = 25;

  // ---------- 状态 ----------
  var state = {
    measureCount: 4,
    measuresPerLine: 4,
    bpm: 80,
    fillBeats: 4,
    score: [],
    patternPool: PATTERNS.map(function () { return true; })
  };

  function newMeasure() { return { beats: [null, null, null, null] }; }
  function syncMeasureCount() {
    while (state.score.length < state.measureCount) state.score.push(newMeasure());
    state.score.length = state.measureCount;
  }

  // ---------- DOM ----------
  var scoreEl = document.getElementById('score');
  var poolEl = document.getElementById('patternPool');
  var measureCountEl = document.getElementById('measureCount');
  var measuresPerLineEl = document.getElementById('measuresPerLine');
  var bpmEl = document.getElementById('bpm');
  var fillBeatsEl = document.getElementById('fillBeats');
  var layoutHintEl = document.getElementById('layoutHint');
  var playBtn = document.getElementById('playBtn');

  // ---------- 音符绘制 ----------
  function beamsOf(dur) {
    if (dur === 1) return 2;
    if (dur === 2 || dur === 3) return 1;
    return 0;
  }

  // notes: [{x, dur}]，画符头 + 符干 + 符杠 + 附点
  function drawNotes(notes, noteY) {
    var out = '', i, nt, stemTop = noteY - STEM_H;
    for (i = 0; i < notes.length; i++) {
      nt = notes[i];
      out += '<ellipse cx="' + nt.x + '" cy="' + noteY + '" rx="5.2" ry="4.1" fill="' + STAFF_COLOR +
             '" transform="rotate(-16 ' + nt.x + ' ' + noteY + ')"/>';
      out += '<rect x="' + (nt.x + 4.3) + '" y="' + stemTop + '" width="1.8" height="' + STEM_H + '" fill="' + STAFF_COLOR + '"/>';
      if (nt.dur === 3) out += '<circle cx="' + (nt.x + 11.5) + '" cy="' + (noteY - 2) + '" r="2" fill="' + STAFF_COLOR + '"/>';
    }
    // 符杠：把连续相同符杠数的音符连成一组
    var segs = [], cur = null;
    for (i = 0; i < notes.length; i++) {
      var bm = beamsOf(notes[i].dur);
      if (cur && cur.bm === bm && bm > 0) cur.list.push(notes[i]);
      else { if (cur) segs.push(cur); cur = { bm: bm, list: [notes[i]] }; }
    }
    if (cur) segs.push(cur);
    for (i = 0; i < segs.length; i++) {
      var sg = segs[i];
      if (sg.bm <= 0) continue;
      var x0 = sg.list[0].x + 4.3;
      var x1 = sg.list[sg.list.length - 1].x + 4.3;
      if (x1 - x0 < 9) x1 = x0 + 9;
      for (var k = 0; k < sg.bm; k++) {
        out += '<rect x="' + x0 + '" y="' + (stemTop + k * 4) + '" width="' + (x1 - x0) + '" height="2.4" fill="' + STAFF_COLOR + '"/>';
      }
    }
    return out;
  }

  var BLOCK_H = STAFF_H + 34;

  // ---------- 渲染 ----------
  function render() {
    var n = state.measureCount;
    var mpl = Math.max(1, Math.min(state.measuresPerLine, n));
    var systems = Math.ceil(n / mpl);

    var W = LEFT_W + mpl * MEAS_W + RIGHT_PAD;
    var H = TOP_PAD + systems * BLOCK_H + (systems - 1) * SYS_GAP + 8;

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';

    for (var s = 0; s < systems; s++) {
      var top = TOP_PAD + s * (BLOCK_H + SYS_GAP);
      var mStart = s * mpl;
      var mCount = Math.min(mpl, n - mStart);
      var staffRight = LEFT_W + mCount * MEAS_W;

      // 五线
      var lp = '';
      for (var li = 0; li < 5; li++) lp += 'M ' + LEFT_W + ' ' + (top + li * LINE) + ' H ' + staffRight + ' ';
      svg += '<path d="' + lp + '" stroke="' + STAFF_COLOR + '" stroke-width="1" fill="none"/>';

      // 打击乐谱号 + 4/4 拍号
      svg += '<rect x="' + (LEFT_W - 20) + '" y="' + (top + 6) + '" width="2.6" height="20" fill="' + STAFF_COLOR + '"/>';
      svg += '<rect x="' + (LEFT_W - 15) + '" y="' + (top + 6) + '" width="2.6" height="20" fill="' + STAFF_COLOR + '"/>';
      svg += '<text x="' + (LEFT_W - 5) + '" y="' + (top + 14) + '" text-anchor="middle" style="font-size:15px;font-weight:700;fill:' + STAFF_COLOR + '">4</text>';
      svg += '<text x="' + (LEFT_W - 5) + '" y="' + (top + 28) + '" text-anchor="middle" style="font-size:15px;font-weight:700;fill:' + STAFF_COLOR + '">4</text>';

      // 小节线
      for (var k = 1; k <= mCount; k++) {
        var bx = LEFT_W + k * MEAS_W;
        if (k === mCount) {
          svg += '<rect x="' + (bx - 5) + '" y="' + top + '" width="1.6" height="' + STAFF_H + '" fill="' + STAFF_COLOR + '"/>';
          svg += '<rect x="' + (bx - 1) + '" y="' + top + '" width="2.8" height="' + STAFF_H + '" fill="' + STAFF_COLOR + '"/>';
        } else {
          svg += '<rect x="' + bx + '" y="' + top + '" width="1.2" height="' + STAFF_H + '" fill="' + STAFF_COLOR + '"/>';
        }
      }

      var noteY = top + NOTE_Y_OFFSET;

      for (var mi = mStart; mi < mStart + mCount; mi++) {
        var mIn = mi - mStart;
        var mX = LEFT_W + mIn * MEAS_W;
        var m = state.score[mi];

        for (var b = 0; b < 4; b++) {
          var bX = mX + b * BEAT_W;
          svg += '<rect class="beat' + (m.beats[b] ? ' on' : '') + '" data-mi="' + mi + '" data-beat="' + b +
                 '" x="' + bX + '" y="' + (top - 12) + '" width="' + BEAT_W + '" height="' + (STAFF_H + 18) + '" rx="3"/>';

          var key = m.beats[b];
          if (!key) {
            // 空拍：浅色休止标记
            svg += '<rect x="' + (bX + BEAT_W / 2 - 6) + '" y="' + (noteY - 3) + '" width="12" height="6" rx="1.5" fill="#c9c3b7"/>';
          } else {
            var p = PAT_BY_KEY[key];
            if (p) {
              var notes = [], di = 0;
              for (var c = 0; c < 4; c++) {
                if (p.cells[c]) { notes.push({ x: bX + 6 + c * (BEAT_W / 4), dur: p.dur[di] }); di++; }
              }
              svg += drawNotes(notes, noteY);
            }
          }
          svg += '<text class="bnum" x="' + (bX + BEAT_W / 2) + '" y="' + (top + STAFF_H + 13) + '" text-anchor="middle">' + (b + 1) + '</text>';
        }
        svg += '<text class="mnum" x="' + (mX + MEAS_W / 2) + '" y="' + (top + STAFF_H + 28) + '" text-anchor="middle">第 ' + (mi + 1) + ' 小节</text>';
      }
    }

    svg += '<rect id="playhead" class="playhead" x="0" y="0" width="' + BEAT_W + '" height="' + STAFF_H + '" style="display:none"/>';
    svg += '</svg>';
    scoreEl.innerHTML = svg;
  }

  // ---------- 交互：点击拍位循环切换节奏型 ----------
  function cycleBeat(mi, beat) {
    var m = state.score[mi];
    if (!m) return;
    var keys = [null];
    for (var i = 0; i < PATTERNS.length; i++) if (state.patternPool[i]) keys.push(PATTERNS[i].key);
    var idx = keys.indexOf(m.beats[beat]);
    m.beats[beat] = keys[(idx + 1) % keys.length];
    render();
  }

  scoreEl.addEventListener('click', function (e) {
    var cell = e.target.closest ? e.target.closest('rect.beat') : null;
    if (!cell) return;
    cycleBeat(+cell.getAttribute('data-mi'), +cell.getAttribute('data-beat'));
  });

  // ---------- 随机生成 ----------
  function randomize() {
    var allowed = [];
    for (var i = 0; i < PATTERNS.length; i++) if (state.patternPool[i]) allowed.push(PATTERNS[i].key);
    if (!allowed.length) { toast('请至少勾选一种节奏型'); return; }
    var layout = LAYOUTS[state.fillBeats] || LAYOUTS[4];
    for (var mi = 0; mi < state.measureCount; mi++) {
      var m = state.score[mi];
      for (var b = 0; b < 4; b++) {
        m.beats[b] = layout[b] ? allowed[Math.floor(Math.random() * allowed.length)] : null;
      }
    }
    render();
    toast('已随机生成 🎲');
  }

  function clearAll() {
    for (var mi = 0; mi < state.measureCount; mi++) state.score[mi] = newMeasure();
    render();
  }

  function applyFillBeats() {
    var layout = LAYOUTS[state.fillBeats] || LAYOUTS[4];
    var hint = '';
    for (var b = 0; b < 4; b++) hint += layout[b] ? '●' : '○';
    layoutHintEl.textContent = '布局 ' + hint.split('').join(' ') + '（●有节奏 ○空拍）';
  }

  // ---------- 节奏型池（条带按音符时值分配宽度，总宽 = 4）----------
  function renderPool() {
    var html = '';
    for (var i = 0; i < PATTERNS.length; i++) {
      var p = PATTERNS[i];
      var bar = '', di = 0;
      for (var c = 0; c < 4; c++) {
        if (p.cells[c]) { bar += '<i style="flex:' + p.dur[di] + '"></i>'; di++; }
      }
      html += '<label class="pat"><div class="pat-head">' +
        '<input type="checkbox" data-idx="' + i + '"' + (state.patternPool[i] ? ' checked' : '') + '>' +
        '<span class="pname">' + p.name + '</span></div>' +
        '<div class="pbar">' + bar + '</div></label>';
    }
    poolEl.innerHTML = html;
  }

  poolEl.addEventListener('change', function (e) {
    var cb = e.target;
    if (cb && cb.getAttribute('data-idx') != null) state.patternPool[+cb.getAttribute('data-idx')] = cb.checked;
  });

  function setPoolAll(v) {
    for (var i = 0; i < state.patternPool.length; i++) state.patternPool[i] = v;
    renderPool();
  }

  // ---------- 试听（Web Audio，16 分音符精度）----------
  var audioCtx = null, playing = false, schedTimer = null, rafId = null;
  var nextTime = 0, nextCell = 0, totalCells = 0, spc = 1, startCtxTime = 0;
  var clickOn = true;

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // 鼓棒敲击音（练习音）
  function stick(t) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(780, t);
    o.frequency.exponentialRampToValueAtTime(430, t + 0.05);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.1);
  }

  // 节拍器 click（每拍第 1 个 16 分格）
  function clickSound(t, strong) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = strong ? 1500 : 1050;
    g.gain.setValueAtTime(strong ? 0.15 : 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.04);
  }

  // 某个 16 分格上是否有符头
  function hasNoteAt(cellIdx) {
    var mi = Math.floor(cellIdx / 16), g = cellIdx % 16;
    var m = state.score[mi];
    if (!m) return false;
    var key = m.beats[Math.floor(g / 4)];
    if (!key) return false;
    var p = PAT_BY_KEY[key];
    return !!(p && p.cells[g % 4]);
  }

  function scheduleCell(cellIdx, t) {
    var g = cellIdx % 16;
    if (clickOn && g % 4 === 0) clickSound(t, g === 0);
    if (hasNoteAt(cellIdx)) stick(t);
  }

  function scheduler() {
    if (!playing) return;
    while (nextTime < audioCtx.currentTime + 0.15) {
      scheduleCell(nextCell, nextTime);
      nextTime += spc;
      nextCell = (nextCell + 1) % totalCells;
    }
  }

  function startPlayback() {
    ensureCtx();
    playing = true;
    totalCells = state.measureCount * 16;
    spc = (60 / state.bpm) / 4;
    nextTime = audioCtx.currentTime + 0.08;
    nextCell = 0;
    startCtxTime = nextTime;
    playBtn.textContent = '⏹ 停止';
    playBtn.classList.add('primary');
    schedTimer = setInterval(scheduler, 25);
    rafId = requestAnimationFrame(updatePlayhead);
  }

  function stopPlayback() {
    playing = false;
    clearInterval(schedTimer);
    cancelAnimationFrame(rafId);
    var ph = document.getElementById('playhead');
    if (ph) ph.style.display = 'none';
    playBtn.textContent = '▶ 试听';
    playBtn.classList.remove('primary');
  }

  function placePlayhead(cellIdx) {
    var ph = document.getElementById('playhead');
    if (!ph) return;
    var mi = Math.floor(cellIdx / 16), g = cellIdx % 16;
    var mpl = Math.max(1, Math.min(state.measuresPerLine, state.measureCount));
    var s = Math.floor(mi / mpl), mIn = mi % mpl;
    var top = TOP_PAD + s * (BLOCK_H + SYS_GAP);
    ph.style.display = 'block';
    ph.setAttribute('x', LEFT_W + mIn * MEAS_W + g * (BEAT_W / 4));
    ph.setAttribute('y', top - 6);
    ph.setAttribute('width', BEAT_W / 4);
    ph.setAttribute('height', STAFF_H + 8);
  }

  function updatePlayhead() {
    if (!playing) return;
    var elapsed = audioCtx.currentTime - startCtxTime;
    placePlayhead(Math.floor(elapsed / spc) % totalCells);
    rafId = requestAnimationFrame(updatePlayhead);
  }

  function togglePlay() { if (playing) stopPlayback(); else startPlayback(); }

  // ---------- 保存 / 加载 ----------
  var LS_KEY = 'rhythm_exercises_v1';

  function getLibrary() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch (e) { return []; }
  }
  function setLibrary(lib) { localStorage.setItem(LS_KEY, JSON.stringify(lib)); }

  function cloneScore(score) {
    return (score || []).map(function (m) {
      var beats = [];
      for (var b = 0; b < 4; b++) {
        var k = (m && m.beats) ? m.beats[b] : null;
        beats.push(k && PAT_BY_KEY[k] ? k : null);
      }
      return { beats: beats };
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderLibrary() {
    var lib = getLibrary();
    var el = document.getElementById('libraryList');
    if (!lib.length) {
      el.innerHTML = '<div class="lib-empty">还没有保存的练习。<br>点击「保存」把当前练习存下来。</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < lib.length; i++) {
      var it = lib[i];
      html += '<div class="lib-item">' +
        '<div class="name">' + esc(it.name) + '</div>' +
        '<div class="meta">' + it.measureCount + ' 小节 · 占 ' + (it.fillBeats || 4) + ' 拍 · BPM ' + it.bpm + ' · ' + (it.date || '') + '</div>' +
        '<div class="acts">' +
          '<button data-act="load" data-id="' + it.id + '" class="primary">加载</button>' +
          '<button data-act="del" data-id="' + it.id + '">删除</button>' +
        '</div></div>';
    }
    el.innerHTML = html;
  }

  function openSaveModal() {
    document.getElementById('modalMask').classList.add('open');
    var input = document.getElementById('saveName');
    input.value = '节奏练习 ' + (getLibrary().length + 1);
    input.focus(); input.select();
  }

  function confirmSave() {
    var name = document.getElementById('saveName').value.trim() || '未命名';
    var lib = getLibrary();
    lib.push({
      id: Date.now(),
      name: name,
      bpm: state.bpm,
      measureCount: state.measureCount,
      measuresPerLine: state.measuresPerLine,
      fillBeats: state.fillBeats,
      score: cloneScore(state.score),
      date: new Date().toLocaleString('zh-CN')
    });
    setLibrary(lib);
    document.getElementById('modalMask').classList.remove('open');
    toast('已保存 ✓');
    if (isBound()) gistUpload();
  }

  function loadExercise(id) {
    var lib = getLibrary(), it = null;
    for (var i = 0; i < lib.length; i++) if (String(lib[i].id) === String(id)) it = lib[i];
    if (!it) return;
    state.measureCount = it.measureCount || 4;
    state.measuresPerLine = it.measuresPerLine || 4;
    state.bpm = it.bpm || 80;
    state.fillBeats = it.fillBeats || 4;
    state.score = cloneScore(it.score);
    syncMeasureCount();
    measureCountEl.value = state.measureCount;
    measuresPerLineEl.value = state.measuresPerLine;
    bpmEl.value = state.bpm;
    fillBeatsEl.value = state.fillBeats;
    applyFillBeats();
    closeLibrary();
    render();
    toast('已加载「' + it.name + '」');
  }

  function deleteExercise(id) {
    var lib = getLibrary();
    lib = lib.filter(function (x) { return String(x.id) !== String(id); });
    setLibrary(lib);
    renderLibrary();
    toast('已删除');
    if (isBound()) gistUpload();
  }

  function exportJSON() {
    var data = {
      name: '节奏练习', bpm: state.bpm, measureCount: state.measureCount,
      measuresPerLine: state.measuresPerLine, fillBeats: state.fillBeats, score: state.score
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'rhythm-practice-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已导出 JSON');
  }

  function importJSON(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        state.measureCount = d.measureCount || 4;
        state.measuresPerLine = d.measuresPerLine || 4;
        state.bpm = d.bpm || 80;
        state.fillBeats = d.fillBeats || 4;
        state.score = cloneScore(d.score);
        syncMeasureCount();
        measureCountEl.value = state.measureCount;
        measuresPerLineEl.value = state.measuresPerLine;
        bpmEl.value = state.bpm;
        fillBeatsEl.value = state.fillBeats;
        applyFillBeats();
        render();
        toast('已导入 ✓');
      } catch (e) { toast('导入失败：文件格式不正确'); }
    };
    reader.readAsText(file);
  }

  // ---------- UI 辅助 ----------
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  function openLibrary() {
    renderLibrary();
    document.getElementById('libraryDrawer').classList.add('open');
    document.getElementById('drawerMask').classList.add('open');
  }
  function closeLibrary() {
    document.getElementById('libraryDrawer').classList.remove('open');
    document.getElementById('drawerMask').classList.remove('open');
  }

  // ---------- 云端同步（GitHub Gist）----------
  var GIST_TOKEN_KEY = 'rhythm_gist_token';
  var GIST_ID_KEY = 'rhythm_gist_id';
  var GIST_FILENAME = 'rhythm-practice.json';
  var GIST_DESC = 'rhythm-practice-sync';

  function getToken() { return localStorage.getItem(GIST_TOKEN_KEY) || ''; }
  function getGistId() { return localStorage.getItem(GIST_ID_KEY) || ''; }
  function isBound() { return !!(getToken() && getGistId()); }

  function gistHeaders() {
    return { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github+json' };
  }

  function handleResp(resp) {
    if (!resp.ok) {
      return resp.json().catch(function () { return {}; }).then(function (j) {
        throw new Error((j && j.message) || ('HTTP ' + resp.status));
      });
    }
    return resp.json();
  }

  function serializeLibrary() {
    return JSON.stringify({ app: 'rhythm-practice', v: 1, updated: Date.now(), library: getLibrary() });
  }

  function updateSyncStatus() {
    var el = document.getElementById('syncStatus');
    if (!el) return;
    if (isBound()) el.textContent = '✅ 已绑定，保存会自动同步到云端';
    else if (getToken()) el.textContent = '🟡 已保存 Token，尚未创建云端数据';
    else el.textContent = '⚪ 未绑定';
  }

  function gistConnect() {
    var input = document.getElementById('gistToken').value.trim();
    var token = input || getToken();
    if (!token) { toast('请粘贴 Token'); return; }
    if (input) localStorage.setItem(GIST_TOKEN_KEY, token);
    fetch('https://api.github.com/gists?per_page=100', { headers: gistHeaders() })
      .then(handleResp)
      .then(function (list) {
        for (var i = 0; i < list.length; i++) {
          if (list[i].description === GIST_DESC) { localStorage.setItem(GIST_ID_KEY, list[i].id); break; }
        }
        updateSyncStatus();
        if (getGistId()) toast('已连接云端 ✓（点「从云端拉取」同步）');
        else toast('已连接 ✓（首次请点「上传到云端」创建）');
      })
      .catch(function (e) { toast('连接失败：' + e.message); });
  }

  function gistUpload() {
    if (!getToken()) { toast('请先输入 Token 并连接'); return; }
    var content = serializeLibrary();
    var files = {};
    files[GIST_FILENAME] = { content: content };
    var id = getGistId();
    var req;
    if (id) {
      req = fetch('https://api.github.com/gists/' + id, {
        method: 'PATCH', headers: gistHeaders(), body: JSON.stringify({ files: files })
      });
    } else {
      req = fetch('https://api.github.com/gists', {
        method: 'POST', headers: gistHeaders(),
        body: JSON.stringify({ description: GIST_DESC, public: false, files: files })
      });
    }
    req.then(handleResp).then(function (json) {
      if (!id && json.id) localStorage.setItem(GIST_ID_KEY, json.id);
      updateSyncStatus();
      toast('已上传到云端 ✓');
    }).catch(function (e) { toast('上传失败：' + e.message); });
  }

  function gistDownload() {
    if (!getToken()) { toast('请先输入 Token 并连接'); return; }
    var id = getGistId();
    if (!id) { toast('尚未绑定云端，请先连接或上传'); return; }
    fetch('https://api.github.com/gists/' + id, { headers: gistHeaders() })
      .then(handleResp)
      .then(function (json) {
        var f = json.files && json.files[GIST_FILENAME];
        if (!f || !f.content) { toast('云端暂无数据'); return; }
        var cloud = JSON.parse(f.content).library || [];
        var lib = getLibrary(), map = {}, i;
        for (i = 0; i < lib.length; i++) map[String(lib[i].id)] = lib[i];
        for (i = 0; i < cloud.length; i++) map[String(cloud[i].id)] = cloud[i];
        var merged = [];
        for (var k in map) if (map.hasOwnProperty(k)) merged.push(map[k]);
        merged.sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
        setLibrary(merged);
        renderLibrary();
        toast('已从云端同步 ✓（' + merged.length + ' 条练习）');
      })
      .catch(function (e) { toast('拉取失败：' + e.message); });
  }

  function gistUnbind() {
    localStorage.removeItem(GIST_TOKEN_KEY);
    localStorage.removeItem(GIST_ID_KEY);
    document.getElementById('gistToken').value = '';
    updateSyncStatus();
    toast('已解除绑定');
  }

  function openSync() {
    document.getElementById('syncMask').classList.add('open');
    var t = document.getElementById('gistToken');
    t.value = '';
    t.placeholder = getToken() ? '已绑定 Token，留空则不修改' : '粘贴你的 GitHub Token（ghp_...）';
    updateSyncStatus();
  }
  function closeSync() { document.getElementById('syncMask').classList.remove('open'); }

  // 改变「占几拍」时：保留已有节奏，仅补齐/清空对应拍位
  function applyLayoutToScore() {
    var layout = LAYOUTS[state.fillBeats] || LAYOUTS[4];
    var allowed = [];
    for (var i = 0; i < PATTERNS.length; i++) if (state.patternPool[i]) allowed.push(PATTERNS[i].key);
    if (!allowed.length) return;
    for (var mi = 0; mi < state.measureCount; mi++) {
      var m = state.score[mi];
      for (var b = 0; b < 4; b++) {
        if (layout[b]) {
          if (!m.beats[b]) m.beats[b] = allowed[Math.floor(Math.random() * allowed.length)];
        } else m.beats[b] = null;
      }
    }
  }

  // ---------- 事件绑定 ----------
  document.getElementById('randomBtn').addEventListener('click', randomize);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('clickBtn').addEventListener('click', function () {
    clickOn = !clickOn;
    this.textContent = clickOn ? '🔔 节拍器：开' : '🔕 节拍器：关';
  });
  document.getElementById('saveBtn').addEventListener('click', openSaveModal);
  document.getElementById('libraryBtn').addEventListener('click', openLibrary);
  document.getElementById('exportBtn').addEventListener('click', exportJSON);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  document.getElementById('importBtn').addEventListener('click', function () { document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('syncBtn').addEventListener('click', openSync);
  document.getElementById('syncClose').addEventListener('click', closeSync);
  document.getElementById('gistConnect').addEventListener('click', gistConnect);
  document.getElementById('gistUpload').addEventListener('click', gistUpload);
  document.getElementById('gistDownload').addEventListener('click', gistDownload);
  document.getElementById('gistUnbind').addEventListener('click', gistUnbind);
  document.getElementById('syncMask').addEventListener('click', function (e) { if (e.target === this) closeSync(); });

  document.getElementById('closeLibrary').addEventListener('click', closeLibrary);
  document.getElementById('drawerMask').addEventListener('click', closeLibrary);
  document.getElementById('cancelSave').addEventListener('click', function () { document.getElementById('modalMask').classList.remove('open'); });
  document.getElementById('confirmSave').addEventListener('click', confirmSave);
  document.getElementById('saveName').addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmSave(); });
  document.getElementById('modalMask').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });

  document.getElementById('libraryList').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!b) return;
    var id = b.getAttribute('data-id');
    if (b.getAttribute('data-act') === 'load') loadExercise(id); else deleteExercise(id);
  });

  document.getElementById('patternToggle').addEventListener('click', function () {
    var w = document.getElementById('poolWrap');
    var open = w.classList.toggle('open');
    this.textContent = (open ? '▾' : '▸') + ' 节奏型池设置（随机生成时允许出现的节奏型）';
  });
  document.getElementById('allOn').addEventListener('click', function () { setPoolAll(true); });
  document.getElementById('allOff').addEventListener('click', function () { setPoolAll(false); });

  measureCountEl.addEventListener('change', function () {
    state.measureCount = Math.max(1, Math.min(32, +this.value || 4));
    this.value = state.measureCount;
    syncMeasureCount();
    render();
  });
  measuresPerLineEl.addEventListener('change', function () {
    state.measuresPerLine = Math.max(1, Math.min(8, +this.value || 4));
    this.value = state.measuresPerLine;
    render();
  });
  bpmEl.addEventListener('change', function () {
    state.bpm = Math.max(30, Math.min(240, +this.value || 80));
    this.value = state.bpm;
  });
  fillBeatsEl.addEventListener('change', function () {
    state.fillBeats = +this.value || 4;
    applyLayoutToScore();
    applyFillBeats();
    render();
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); randomize(); }
    else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); clearAll(); }
  });

  // ---------- 初始化 ----------
  syncMeasureCount();
  renderPool();
  applyFillBeats();
  randomize();
  if (isBound()) gistDownload();
})();
</script>
</body>
</html>
